# Quiz Platform — PRODUCTION nginx template (TLS + Cloudflare).
#
# This is a TEMPLATE. Copy to infra/nginx/production.conf (or generate it):
#
#   envsubst '${CERT_FILE} ${KEY_FILE}' < infra/nginx/production.conf > /etc/nginx/conf.d/default.conf
#
# then mount generated file in compose / a dedicated nginx container.
#
# TLS certificate files live outside this repo (e.g. /etc/letsencrypt/live/...).
#
# Cloudflare: with the orange cloud on, nginx should reconstruct the real
# visitor IP from CF, not from the proxy edge. Keep the `set_real_ip_from`
# list in sync with https://www.cloudflare.com/ips/ (Cloudflare publishes this
# list; update it when it changes). The API trusts the proxy chain
# (`trustProxy: true`), so per-IP rate limiting keys on the real visitor IP.

upstream api_upstream {
    server api:3001;
}

upstream web_upstream {
    server web:3000;
}

# Cloudflare visitor-IP reconstruction (keep the ranges updated).
# WARNING: only trust these sources when the app is reachable behind Cloudflare.
# set_real_ip_from 173.245.48.0/20;
# set_real_ip_from 103.21.244.0/22;
# set_real_ip_from 103.22.200.0/22;
# set_real_ip_from 103.31.4.0/22;
# set_real_ip_from 141.101.64.0/18;
# set_real_ip_from 108.162.192.0/18;
# set_real_ip_from 190.93.240.0/20;
# set_real_ip_from 188.114.96.0/20;
# set_real_ip_from 197.234.240.0/22;
# set_real_ip_from 198.41.128.0/17;
# set_real_ip_from 162.158.0.0/15;
# set_real_ip_from 104.16.0.0/13;
# set_real_ip_from 104.24.0.0/14;
# set_real_ip_from 172.64.0.0/13;
# set_real_ip_from 131.0.72.0/22;
# real_ip_header CF-Connecting-IP;

server {
    listen 80;
    server_name __SERVER_NAME__;
    # Force HTTPS (Cloudflare can also do this; belt & braces).
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name __SERVER_NAME__;

    ssl_certificate     ${CERT_FILE};
    ssl_certificate_key ${KEY_FILE};
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    client_max_body_size 1m;

    # REST API
    location /api/ {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Socket.IO (long-polling + WebSocket upgrade)
    location /socket.io/ {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }

    # Next.js frontend
    location / {
        proxy_pass http://web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}