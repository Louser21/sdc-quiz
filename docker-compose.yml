# Quiz Platform - local/staging compose stack.
#   docker compose up -d                     -> postgres + redis only (local dev)
#   docker compose --profile app up -d       -> full app stack + nginx (:8080)
#
# Config comes from the repo-root `.env` (see .env.example). Container-side
# hostnames override host-side defaults for same-network service resolution.

name: quiz-platform

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: quiz
      POSTGRES_USER: quiz
      POSTGRES_PASSWORD: quiz
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quiz -d quiz"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    profiles: ["app"]
    build:
      context: .
      dockerfile: infra/api.Dockerfile
    env_file: .env
    environment:
      # Same-network service hostnames override the host-side defaults.
      DATABASE_URL: postgresql://quiz:quiz@postgres:5432/quiz
      REDIS_URL: redis://redis:6379
      FRONTEND_ORIGIN: http://localhost:8080
      PUBLIC_URL: http://localhost:8080
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  web:
    profiles: ["app"]
    build:
      context: .
      dockerfile: infra/web.Dockerfile
    # No host port: reachable only via the nginx single origin (internal :3000).
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  nginx:
    profiles: ["app"]
    image: nginx:1.27-alpine
    ports:
      - "${NGINX_HTTP_PORT:-8080}:80"
    volumes:
      - ./infra/nginx/quiz.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - web
    restart: unless-stopped

volumes:
  pgdata:
  redisdata: